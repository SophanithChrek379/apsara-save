<!-- App mark: an "A" knocked out of a filled disc, the same construction as the
     sibling app Apsara Spend (amber disc on a near-black plate). The pair is meant
     to be told apart by hue alone at 16px — amber for money leaving, emerald for
     money kept — so the two icons deliberately share their geometry and differ
     only in the one fill below. Changing the disc's shape here breaks that reading.

     Emerald-500 (#10B981) rather than a fresh green: it is the accent the tracker
     already uses ~33 times for solid fills, so the icon and the page it stands for
     name the same colour.

     The "A" is cut in the plate colour instead of being drawn in a third ink. That
     keeps the mark to two values, which is what survives the 512 -> 16 downscale a
     tab performs; a light "A" on the disc would silt up at that size.

     Geometry sits on a 512 grid with every edge at slope 0.4 (2:5), so the stem
     walls stay a constant 44 wide from apex to baseline and the counter closes on
     the centre line at y=213 on its own — no separate crossbar fudge. The plate
     carries its own dark fill rather than inheriting the page palette: a favicon is
     composited onto browser chrome, not onto the app, so it has to hold against a
     light *and* a dark tab strip with no media query to help it. -->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#0A0A0A" />
  <circle cx="256" cy="256" r="192" fill="#10B981" />
  <!-- Outer silhouette then the triangular counter; evenodd punches the counter out. -->
  <path
    fill="#0A0A0A"
    fill-rule="evenodd"
    d="M230 168 L282 168 L346 328 L302 328 L290.8 300 L221.2 300 L210 328 L166 328 Z
       M256 213 L278 268 L234 268 Z"
  />
</svg>
